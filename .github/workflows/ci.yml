name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run assets:verify
      - run: npm run profile:verify
      - run: git diff --exit-code -- com.renehagen.codex-micro.sdPlugin/images com.renehagen.codex-micro.sdPlugin/profiles
      - run: npm run build
      - run: npm run validate
